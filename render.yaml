services:
  - type: web
    name: sky-clash
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
